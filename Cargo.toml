[workspace]
members = ["examples/simple_app", "examples/advanced_app"]

[package]
name = "axum-guard-rs"
version = "1.4.0"
edition = "2024"
rust-version = "1.92"
description = "Application-layer security middleware for axum, powered by the guard-core-rs engine. Part of the guard ecosystem."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rennf93/axum-guard-rs"
readme = "README.md"
keywords = ["security", "middleware", "api", "axum", "tower"]
categories = ["web-programming"]

[lib]
name = "axum_guard_rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# guard-core-engine is published to crates.io (4.3.0); the path points at the
# engine crate inside a sibling guard-core-rs checkout so local builds and CI
# (see .github/workflows/ci.yml) exercise the engine from source. The version
# pin stays in lockstep with the published engine release. The websocket
# guard module runs the reference upgrade sequence directly on the engine
# primitives (the sibling `tower-guard-rs` wraps the HTTP request path).
guard-core-engine = { path = "../guard-core-rs/crates/guard-core-engine", version = "4.3.1" }
# The facade carries the geo lifecycle manager (`IpInfoManager`) the status
# route's geo-health snapshot renders (same path/version discipline as the
# engine above).
guard-core-rs = { path = "../guard-core-rs/crates/guard-core-rs", version = "4.3.1" }
# tower-guard-rs 1.4.0 is published to crates.io (itself pinned to
# guard-core-engine 4.3.1); the path points at a sibling tower-guard-rs
# checkout so local builds and CI (see .github/workflows/ci.yml) exercise the
# stack from source. The version pin stays in lockstep with the published
# release.
tower-guard-rs = { path = "../tower-guard-rs", version = "1.4.0" }
# Direct handle on the `Layer`/`Service` traits the `ClientIpLayer` implements;
# tower 0.5 is already the resolved version through tower-guard-rs.
tower = { version = "0.5", default-features = false }
serde_json = "1"

[dev-dependencies]
chrono = "0.4"
bytes = "1.10"
# guard-core-rs stays a dev dependency: the runtime surfaces this crate
# re-exports all come from `tower-guard-rs`, and the websocket guard runs
# the engine primitives through the direct dependency above.
guard-core-rs = { path = "../guard-core-rs/crates/guard-core-rs", version = "4.3.1" }
http = "1.3"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                     = { level = "deny", priority = -1 }
pedantic                = { level = "warn", priority = -1 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
