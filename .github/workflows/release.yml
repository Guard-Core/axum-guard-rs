name: Release Gate

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test at tag (${{ matrix.rust }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', '1.92.0']
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Moving branch, same tradeoff as ci.yml: the dependencies are sibling
      # path checkouts, so the tag gate rebuilds against fresh master
      # checkouts (which carry the matching engine release). The adapter
      # depends on tower-guard-rs, which in turn depends on guard-core-rs,
      # so both siblings are checked out.
      - name: Checkout tower-guard-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/tower-guard-rs
          ref: master
          path: tower-checkout
          persist-credentials: false

      - name: Place tower-guard-rs at the path dependency location
        run: mv tower-checkout ../tower-guard-rs

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          rustflags: ""

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  tag-consistency:
    name: Tag matches crate version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo metadata resolves the sibling path dependencies, so both must
      # be checked out before the version can be read (same as the test job).
      - name: Checkout tower-guard-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/tower-guard-rs
          ref: master
          path: tower-checkout
          persist-credentials: false

      - name: Place tower-guard-rs at the path dependency location
        run: mv tower-checkout ../tower-guard-rs

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      # Publishing is automated: the publish job below runs on GitHub
      # release creation. This tag/version consistency gate remains the
      # cheap check that the tag matches the published crate version.
      - name: Verify tag equals the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "axum-guard-rs") | .version')
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match crate version $version"
            exit 1
          fi
          echo "ok: tag v$tag matches crate version $version"

  publish:
    name: Publish to crates.io
    needs: tag-consistency
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The root workspace (examples included) resolves the sibling path
      # dependencies before packaging, so both must be checked out here too.
      # The packaged crate itself ships the registry dependencies: packaging
      # strips the paths and keeps the version pins, which already exist on
      # crates.io.
      - name: Checkout tower-guard-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/tower-guard-rs
          ref: master
          path: tower-checkout
          persist-credentials: false

      - name: Place tower-guard-rs at the path dependency location
        run: mv tower-checkout ../tower-guard-rs

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      # Retried up to 3 times (crates.io transient 5xx). NOTE on reruns:
      # crates.io rejects re-uploading an identical version.
      - name: Publish axum-guard-rs
        run: |
          for attempt in 1 2 3; do
            if cargo publish; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "axum-guard-rs publish failed after 3 attempts"
          exit 1
