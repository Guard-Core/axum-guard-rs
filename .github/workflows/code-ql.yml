name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # One job for every language, so the required check context is exactly `code-ql` (a matrix would suffix it
  # with the language).
  code-ql:
    name: code-ql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo autobuild resolves the whole workspace graph, which includes the
      # sibling path dependencies, so the siblings must be checked out first
      # (same tradeoff and comment as ci.yml).
      - name: Checkout tower-guard-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/tower-guard-rs
          # The stage composition merged as rennf93/tower-guard-rs#35;
          # master carries it.
          ref: master
          path: tower-checkout
          persist-credentials: false

      - name: Checkout guard-core-rs (transitive path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place siblings at the path dependency locations
        run: |
          mv tower-checkout ../tower-guard-rs
          mv core-checkout ../guard-core-rs

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: rust,actions

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          # The category of the earlier `analyze` job, so the existing analyses and alerts carry over.
          category: .github/workflows/code-ql.yml:analyze
