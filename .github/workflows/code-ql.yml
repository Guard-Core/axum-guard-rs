name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo autobuild resolves the whole workspace graph, which includes the
      # sibling path dependencies, so the siblings must be checked out first
      # (same tradeoff and comment as ci.yml).
      - name: Checkout tower-guard-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rennf93/tower-guard-rs
          # TEMPORARY pin: the stage composition ships on the pipeline branch;
          # revert to master once the tower-guard-rs PR merges.
          ref: feat/wire-full-stage-pipeline
          path: tower-checkout
          persist-credentials: false

      - name: Checkout guard-core-rs (transitive path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rennf93/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place siblings at the path dependency locations
        run: |
          mv tower-checkout ../tower-guard-rs
          mv core-checkout ../guard-core-rs

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
