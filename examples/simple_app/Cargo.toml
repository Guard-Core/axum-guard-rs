[package]
name = "axum-guard-simple-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Minimal axum-guard-rs example service."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
axum-guard-rs = { path = "../..", version = "1.5.0" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                = { level = "deny", priority = -1 }
pedantic           = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
