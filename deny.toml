# cargo-deny configuration, based on guard-agent-rs's permissive license
# allow-list, trimmed to the entries the workspace actually uses (plus a few
# likely arrivals from the engine's future Redis/I/O surface). Checks
# advisories, licenses, bans, and sources for the whole workspace
# (adapter + example apps).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Temporary until rennf93/tower-guard-rs#5 (parity branch) merges: the
# tower-guard-rs@master checkout still declares its engine path dependency
# without a version, which registers as a wildcard here. Tighten back to
# "deny" once that lands and the sibling checkout carries the versioned dep.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
